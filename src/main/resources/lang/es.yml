# TukiUHC — textos en español (formato MiniMessage: https://docs.advntr.dev/minimessage/format)
# <prefix> inserta el prefijo. Deja un texto en "" para no enviarlo.
# No cambies este número: el plugin lo usa para actualizar el archivo.
lang-version: 2
prefix: "<dark_gray>[<gradient:#FF5555:#FFAA00><bold>UHC</bold></gradient><dark_gray>]</dark_gray> <gold>»</gold> "

phase:
