    name: "<gray>No teams"
    lore: ["<gray>Each player plays alone."]
  manual:
    name: "<green>Manual"
    lore: ["<gray>You create the teams from the menu", "<gray>or with <white>/uhcteam</white>."]
  random:
    name: "<yellow>Random"
    lore: ["<gray>Everyone starts apart and the", "<gray>teams are revealed in a given episode."]
  proximity:
    name: "<light_purple>Love at first sight"
    lore: ["<gray>Teams are formed by coming together", "<gray>during the match."]

