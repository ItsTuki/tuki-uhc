  cancelled: "<prefix><gray>Cancelled."
  not-number: "<prefix><red>That is not a number."
  number: "<prefix><yellow>Type the new value in chat:"
  match-name: "<prefix><yellow>Type the match name in chat:"
  party-name: "<prefix><yellow>Type the name in chat:"
  feature-value: "<prefix><yellow>Type the value in chat <gray>(<hint>)</gray>:"
