    lore: ["<gray>Free-for-all, no teams.", "<gray>The last player alive wins."]
  dragon:
    name: "<light_purple>Dragon (PvD)"
    lore: ["<gray>End portal at 0 0 with 9 eyes.", "<gray>Whoever finishes off the dragon wins", "<gray>before time runs out.", "<gray>Works for one player or teams."]
  trolls-ratas:
    name: "<dark_purple>Trolls and Rats"
    lore: ["<gray>Teams of 3 with secret roles:", "<green>Troll</green><gray>, <dark_purple>Rat</dark_purple> <gray>and <aqua>Normal</aqua>."]
  resource-rush:
    name: "<gold>Resource Rush"
    lore: ["<gray>Get 12 items in order of", "<gray>difficulty before the others.", "<gray>No time limit."]

team-modes:
