# TukiUHC — English texts (MiniMessage format: https://docs.advntr.dev/minimessage/format)
# <prefix> inserts the prefix. Leave a text as "" to not send it.
prefix: "<dark_gray>[<gradient:#FF5555:#FFAA00><bold>UHC</bold></gradient><dark_gray>]</dark_gray> <gold>»</gold> "

phase:
  pve: "<green>PVE"
  pvp: "<red>PVP"
  pvd: "<light_purple>PVD"

game:
  already-running: "<prefix><red>A match is already in progress. Use <white>/sos</white> to restart it."
  no-players: "<prefix><red>There are no players to start."
  preparing: "<prefix><yellow>Preparing the match and scattering players…"
  prepared: "<prefix><green>Everyone is scattered! The organizer can use <white>/uhcstart</white>."
  still-scattering: "<prefix><yellow><white><count></white> groups still need to be scattered. Wait a moment."
  prepare-first: "<prefix><red>Use <white>/uhcprepare</white> first."
  not-ready: "<prefix><red>Some players are not connected: <white><players></white>. Use <white>/uhcforcestart</white> to start anyway."
  countdown-subtitle: "<gray>The match is about to begin"
  started-title: "<gradient:#FF5555:#FFAA00><bold>LET'S PLAY!"
  started-subtitle: "<gray>Good luck"
  started: "<prefix><green><bold>The match has started!</bold> <gray>There is no natural health regeneration."
  episode-start: "<prefix><gold>Part <white><episode></white> begins!"
  overtime: "<prefix><red>Overtime! Part <white><episode></white>: the match continues until there is a winner."
  episode-end: "<prefix><gray>Part <white><episode></white> ends."
  episode-title: "<gold><bold>Part <episode>"
  episode-subtitle: "<phase>"
  rest: "<prefix><aqua>Break: part <white><episode></white> starts in <white><seconds></white> seconds."
  rest-title: "<aqua><bold>Break"
  rest-subtitle: "<gray>Time is paused (<seconds> s)"
  rest-actionbar: "<aqua>Break · <white><seconds></white> s"
  pvp-enabled: "<prefix><red><bold>PvP is now enabled!"
  pact-ended: "<prefix><yellow>The knights' pact has ended."
  pvp-disabled-hit: "<red>PvP is not enabled yet."
  death-prefix: "<dark_red>☠ </dark_red>"
  you-died: "<prefix><gray>You have been eliminated. You are now a spectator."
  late-join: "<prefix><gray>The match has already started: you join as a spectator."
  team-eliminated: "<prefix><red>Team <white><team></white> has been eliminated."
  end-title: "<gold><bold>GAME OVER!"
  end-subtitle: "<yellow>Winner: <white><winner>"
  win-reason-last: "<gray>Last team standing"
  no-winner: "<gray>There was no winner"
  nobody: "Nobody"
  stopped: "<gray>Match stopped by the organizer"

stats:
  header: "<gold><bold>━━━━━━━━ FINAL STATISTICS ━━━━━━━━"
  winner: "<yellow>★ Winner: <white><winner>"
  duration: "<gray>⏱ Duration: <white><time>"
  top-killer: "<gray>⚔ Player with most kills: <white><player></white> (<kills>)"
  most-damaged: "<gray>❤ Player with most damage taken: <white><player></white> (<hearts> hearts)"
  top-team: "<gray>⚐ Team with most kills: <white><team></white> (<kills>)"
  iron-man: "<gray>✔ Iron Man: <white><player></white> (<hearts> hearts of damage)"
  straw-man: "<gray>☠ Straw Man: <white><player></white> (died at <time>)"
  podium: "<gold>Team survival podium:"
  podium-entry: "<gray>  <place>. <white><team></white> <dark_gray>(<time>)"

border:
  shrinking: "<prefix><red>The border is closing in to a radius of <white><radius></white> blocks during part <white><episode></white>."
  final-warning: "<prefix><yellow>Remember that by the end of this part you must be at <white>0 0</white>!"
  final-battle: "<prefix><red><bold>The final battle begins!"
  final-battle-title: "<red><bold>Final battle!"
  final-battle-subtitle: "<gray>Everyone to the center of the map"

teams:
  auto-assigned: "<prefix><yellow><white><count></white> players without a team were placed into new random teams."
  default-name: "Team"
  random-pending: "<prefix><gray>Random teams will be revealed in part <white><episode></white>."
  random-countdown: "<prefix><yellow>Your teammate will be revealed in <white><seconds></white> seconds!"
  random-revealed: "<prefix><green>The teams have been revealed!"
  your-team-title: "<gold>Your team"
  your-team: "<prefix><gray>Your team is <white><team></white>: <mates>"
  proximity-start: "<prefix><light_purple>❤ Love at first sight: get close to another player to form a team (size <white><size></white>, radius <white><radius></white>)."
  proximity-near: "<light_purple>❤ <white><player></white> is <white><distance></white> blocks away"
  proximity-formed: "<prefix><light_purple>❤ Team <white><team></white> has formed! <gray>(<players>)"
  shuffled: "<prefix><green><white><count></white> random teams were created."
  created: "<prefix><green>Created: <white><team></white>."
  deleted: "<prefix><yellow>Deleted: <white><team></white>."
  not-found: "<prefix><red><white><team></white> does not exist."
  added: "<prefix><green>Players added to <white><team></white>."
  joined: "<prefix><green>You are now in <white><team></white>."
  removed: "<prefix><yellow>Players removed."
  cleared: "<prefix><yellow>All teams and groups were deleted."
  none: "<prefix><gray>No teams have been created."
  no-team: "<prefix><red>You don't have a team."
  renamed: "<prefix><green><white><player></white> renamed the team to <white><team></white>."

chat:
  global: "<dark_gray>[<red>GLOBAL</red>]</dark_gray> <white><player></white> <gold>»</gold> <white><message>"
  team: "<dark_gray>[<green>TEAM</green>]</dark_gray> <team> <white><player></white> <gold>»</gold> <gray><message>"
  group: "<dark_gray>[<aqua>GROUP</aqua>]</dark_gray> <group> <white><player></white> <gold>»</gold> <aqua><message>"
  rats: "<dark_gray>[<dark_purple>RATS</dark_purple>]</dark_gray> <white><player></white> <gold>»</gold> <light_purple><message>"
  dead: "<dark_gray>[<gray>DEAD</gray>]</dark_gray> <gray><player> » <message>"

items:
  golden-head:
    name: "<gold><bold>Golden Head"
    lore: ["<gray>Regeneration II: 4 hearts", "<gray>+2 absorption hearts (2 min)"]
  golden-skull:
    name: "<gold><bold>Golden Skull"
    lore: ["<gray>Regeneration II: 4 hearts", "<gray>+2 absorption hearts (2 min)"]
  super-apple:
    name: "<yellow><bold>Super Golden Apple"
    lore: ["<gray>Instantly restores 4 hearts"]
  hyper-apple:
    name: "<light_purple><bold>Hyper Golden Apple"
    lore: ["<gray>+2 max health hearts", "<dark_gray>Max <max> per player"]
    limit: "<prefix><red>You have already eaten the maximum of <white><max></white> Hyper Apples."
    eaten: "<prefix><light_purple>+2 max hearts <gray>(<count>/<max>)"
  revive-crystal:
    name: "<aqua><bold>Resurrection Crystal"
    lore: ["<gray>Place it on <white>bedrock</white> to", "<gray>revive a fallen teammate."]
  team-compass:
    name: "<aqua><bold>Teammate Compass"
    lore: ["<gray>Points to your nearest teammate."]
    received: "<prefix><aqua>You have received a compass that guides you to your teammate."

revive:
  need-bedrock: "<prefix><red>The crystal must be placed on bedrock."
  disabled: "<prefix><red>Resurrection is not active."
  no-target: "<prefix><red>There are no teammates you can revive (only once per player)."
  done: "<prefix><aqua>✦ <white><player></white> has been resurrected thanks to <white><by></white>."
  cannot: "<prefix><red>That player cannot be revived."

rewards:
  shulker-warning: "<prefix><light_purple>In 30 seconds you will receive a Shulker Box, make room in your inventory!"
  shulker-given: "<prefix><light_purple>All players received a Shulker Box."
  life-boost: "<prefix><red>❤ Everyone gets 10 extra hearts and Resistance II!"
  life-boost-title: "<red><bold>+10 ❤"
  life-boost-subtitle: "<gray>and Resistance II for the final battle"
  locator-on: "<prefix><aqua>The player locator bar is now enabled!"
  graves-header: "<prefix><gray>List of dead players:"
  graves-entry: "<dark_gray> - </dark_gray><white><player></white> <gray>died in <yellow><biome></yellow> | X=<x> Y=<y> Z=<z>"
  graves-empty: "<prefix><gray>Nobody has died yet."

rules:
  stew: "<gray>Suspicious stew only gives glowing (<seconds> s)."

head-steal:
  thief: "<prefix><gold>You stole <white><player></white>'s head!"
  victim: "<prefix><red><white><player></white> stole your head with their rod. You won't drop it when you die."
  already: "<prefix><gray><white><player></white>'s head has already been stolen."

escort:
  warning-title: "<yellow><bold>WARNING!"
  warning-subtitle: "<gray>You have strayed too far from your team (max. <max> blocks)"
  danger-title: "<red><bold>DANGER!"
  danger-subtitle: "<gray>You are too far apart: the team takes damage"

copper:
  item-name: "<#E77C56><bold>Copper Golem Statue"
  item-lore: ["<gray>Place it to create a Blessing Area:", "<gray>regeneration for your team for 5 min.", "<red>If an enemy breaks it, your team loses 3 ❤"]
  blessed: "<prefix><#E77C56>You have been blessed with a Golem! <gray>(held by <white><player></white>)"
  activated: "<prefix><#E77C56>Golem blessing activated!"
  intruder: "<prefix><red><white><player></white> entered your Blessing Area!"
  broken: "<prefix><red><white><player></white> broke your golem! You lose 3 hearts."
  you-broke: "<prefix><gold>You broke an enemy golem!"
  expired: "<prefix><gray>The golem's blessing has ended."

skins:
  rotated: "<prefix><light_purple>The skins have rotated! Nobody knows who is who…"
  not-enough: "<prefix><gray>There are not enough skins to rotate."
  revealed: "<prefix><light_purple>You have revealed <white><player></white>!"
  you-were-revealed: "<prefix><light_purple>You have been revealed!"

afk:
  label: "<red><bold>AFK"
  enabled: "<prefix><gray>You are AFK: you are invulnerable until you move."
  disabled: "<prefix><green>You are no longer AFK."
  broadcast: "<prefix><gray><player> is AFK."

dragon:
  objective: "<prefix><light_purple>Objective: kill the dragon. At <white>0 0</white> there is an End portal with 9 eyes: get the 3 missing ones. Time: <white><time></white>."
  killed: "<prefix><light_purple><bold><white><player></white> finished off the dragon!"
  time-up: "<prefix><red>Time is up and the dragon is still alive."
  time-up-reason: "<gray>The dragon survived"

trolls:
  intro: "<prefix><dark_purple>Trolls and Rats: secret roles are assigned at the start of part <white><episode></white>."
  assigned: "<prefix><dark_purple>Roles have been assigned. Use <white>/uhcrole</white> to see yours again."
  no-role: "<prefix><gray>You have no role in this match."
  role-pending: "<gray>Hidden"
  troll-cannot: "<red>Trolls cannot attack their own team."
  rat-cannot: "<red>As a Rat, you can only eliminate your team indirectly."
  killed-troll: "<prefix><red>You killed your team's Troll! You lose half of your max health and the Rat can attack you."
  rat-can-attack: "<prefix><dark_purple><white><player></white> killed the Troll: you can now attack them directly."
  revealed: "<prefix><white><player></white> <gray>reveals they are</gray> <role>"
  you-revealed: "<prefix><gray>You revealed your role to your team."
  role:
    troll:
      name: "<green>Troll"
      title: "<green><bold>You are the TROLL"
      subtitle: "<gray>Find out who the Rat is"
      description: ["<green>[Troll]</green> <gray>Find out who the Rat on your team is.", "<gray>You cannot damage your teammates: sow discord and doubt."]
    rata:
      name: "<dark_purple>Rat"
      title: "<dark_purple><bold>You are the RAT"
      subtitle: "<gray>Eliminate your team… without getting caught"
      description: ["<dark_purple>[Rat]</dark_purple> <gray>Eliminate your teammates <white>indirectly</white>.", "<gray>No weapons or lava. Talk to the other Rats by typing <white>#</white> before your message."]
    normal:
      name: "<aqua>Normal"
      title: "<aqua><bold>You are NORMAL"
      subtitle: "<gray>Execute whoever you suspect is the Rat"
      description: ["<aqua>[Normal]</aqua> <gray>You can attack your teammates if you suspect they are the Rat.", "<red>If you kill the Troll you lose half of your health and the Rat will be able to attack you."]

rush:
  start: "<prefix><gold>Resource Rush: get <white><count></white> items in order. The first to finish wins!"
  first: "<prefix><gold>First objective: <white><item>"
  got: "<prefix><gold><white><who></white> got <white><item></white> <gray>(<done>/<total>)"
  next: "<prefix><yellow>Next objective: <white><item>"
  win: "<gray>Completed the list"

