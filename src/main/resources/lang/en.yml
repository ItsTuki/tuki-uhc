  rush-target: "<gray>Objective: <white><item></white> <dark_gray>(<done>/<total>)"
  rush-done: "<green>List complete!"
  role: "<gray>Role: <role>"

tab:
  header: "<newline><gradient:#FF5555:#FFAA00><bold><name></bold></gradient><newline>"
