    lore: ["<gray>Pauses time for a few seconds", "<gray>between each part."]
  player-locator:
    name: "<aqua>Player locator"
    lore: ["<gray>Enables the player locator bar", "<gray>in the given part."]
  skin-rotation:
    name: "<light_purple>Skin rotation"
