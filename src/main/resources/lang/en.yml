  healed: "<prefix><green>An organizer healed you."
  heal-done: "<prefix><green>Healed."

help:
  player:
    - "<gradient:#FF5555:#FFAA00><bold>TukiUHC</bold></gradient> <gray>v<version>"
    - "<yellow>/uhchelp</yellow> <gray>— this help"
    - "<yellow>/afk</yellow> <gray>— AFK mode (invulnerable until you move)"
    - "<yellow>/renameteam <nombre></yellow> <gray>— change your team's name"
    - "<yellow>/uhcrole [revelar]</yellow> <gray>— your role in Trolls and Rats (revelar = reveal)"
    - "<gray>Chat: normal = team, <white>!</white> = everyone, <white>@</white> = group, <white>#</white> = rats"
  admin:
    - "<gold>Organizer:"
    - "<yellow>/uhcconfig</yellow> <gray>— configuration menu"
    - "<yellow>/uhcprepare</yellow> <gray>— scatters players across the map"
    - "<yellow>/uhcstart</yellow> <gray>— 10 s countdown if everyone is ready"
    - "<yellow>/uhcforcestart</yellow> <gray>— start without waiting for anyone"
    - "<yellow>/uhcstop</yellow> <gray>— ends the match with no winner"
    - "<yellow>/sos</yellow> <gray>— restarts the match and reloads the configuration"
    - "<yellow>/uhcteam</yellow> <gray>— create, delete and fill teams/groups"
    - "<yellow>/heal <jugador></yellow> <gray>— heal a player"
    - "<yellow>/uhcrevive <jugador></yellow> <gray>— revive a player"
    - "<yellow>/uhcgive <ítem></yellow> <gray>— special test items"

