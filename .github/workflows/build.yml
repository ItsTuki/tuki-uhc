name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: TukiUHC
          path: build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: TukiUHC-Legacy
          path: legacy/build/libs/*.jar

      - name: Adjuntar jar al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar legacy/build/libs/*.jar --clobber
