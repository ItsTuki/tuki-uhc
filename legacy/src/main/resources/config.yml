# ─────────────────────────────────────────────────────────────
#  TukiUHC — configuración
#  Lo más cómodo es editarla en el juego con /uhcconfig: los cambios se guardan aquí solos.
#  Textos: lang/es.yml y lang/en.yml · Objetos de Resource Rush: resource-rush.yml
# ─────────────────────────────────────────────────────────────

match:
  name: "Partida UHC"
  # es o en
  language: es
  # PVP, SOLITARIOS, DRAGON, TROLLS_RATAS, RESOURCE_RUSH
  mode: PVP
  # EPISODES (partes con título y descanso) o TIMED (duración fija, borde que se cierra sin parar)
  format: EPISODES

teams:
  # SOLO, MANUAL, RANDOM (aleatorios), PROXIMITY (amor a primera vista)
  mode: MANUAL
  size: 2
  random-reveal-episode: 2
  proximity-radius: 100

episodes:
  # Duración de cada parte en minutos y cantidad de partes
  minutes: 20
  count: 5
  # Parte en la que se activa el PvP
  pvp-episode: 2

border:
  # Radio inicial del mapa (el mapa mide el doble de lado)
  radius: 1500
  final-radius: 50
  # Parte en la que se cierra el borde (0 = penúltima)
  shrink-episode: 0

timed:
  # Formato TIMED: duración total de la partida en minutos
  minutes: 120
  # Minuto en que empieza a cerrarse el borde; se cierra sin parar hasta el radio final al terminar el tiempo
  border-start-minutes: 30
  # Al acabar el tiempo con más de un equipo vivo: muerte súbita (el borde baja a este radio en estos segundos)
  sudden-death-radius: 10
  sudden-death-seconds: 180

# Escenarios de UHC (también en /uhcconfig → Escenarios)
scenarios:
  cut-clean: false
  timber: false
  hastey-boys: false
  double-ores: false
  triple-ores: false
  lucky-leaves: false
  fireless: false
  no-fall: false
  no-clean: false
  blood-diamonds: false
  diamondless: false
  goldless: false
  bowless: false
  rodless: false
  horseless: false
  vein-miner: false
  double-xp: false
  triple-xp: false
  barebones: false
  swordless: false
  no-enchants: false
  lucky-book: false
  blood-enchant: false
  time-bomb: false
  air-drops: false
  radar: false
  rush: false
  red-vs-blue: false
  final-uhc: false
  pyro: false
  superheroes: false
  anonymous: false
  web-cage: false
  safe-loot: false
  siphon: false

spectators:
  # true: los eliminados vuelan invisibles con una brújula para ir con los vivos y ver su inventario.
  # false: modo espectador normal del juego.
  ghost: true

scenarios-settings:
  timber-max-logs: 256
  # Probabilidad (%) de que una hoja suelte una manzana dorada
  lucky-leaves-percent: 0.5
  goldless-gold-on-death: 8
  no-clean-seconds: 20
  # VeinMiner: bloques máximos por veta
  vein-miner-max: 64
  # LuckyBook: probabilidad (%) de libro encantado al picar un mineral
  lucky-book-percent: 3
  # TimeBomb: segundos hasta la explosión y su fuerza (4 = TNT)
  time-bomb-seconds: 30
  time-bomb-power: 4
  # SafeLoot: segundos que el cofre es solo del que hizo la kill
  safe-loot-seconds: 60
  # AirDrops: cada cuántos minutos cae un cofre
  air-drop-minutes: 10

map:
  # /uhcpregen: genera los chunks hasta el radio del borde + este margen
  pregen-margin: 64
  # Chunks que se generan a la vez (más = más rápido y más carga)
  pregen-parallel: 16
  # Si los TPS bajan de aquí, la pregeneración va más lenta
  pregen-min-tps: 17
  # Cuevas más grandes (opción big-caves): fuerza 1.0 = normal; profundidad mínima bajo la superficie
  caves:
    strength: 1.0
    min-depth: 10
  # Más minerales (opción ore-boost). "veins" × "size" ≈ lo que trae un chunk normal, así un +100% es el doble.
  ores:
    diamond: {veins: 4.0, size: 5, min-y: -60, max-y: 16}
    gold: {veins: 3.4, size: 7, min-y: -60, max-y: 32}
    iron: {veins: 7.0, size: 8, min-y: -24, max-y: 72}
    lapis: {veins: 3.2, size: 6, min-y: -32, max-y: 32}
    redstone: {veins: 4.0, size: 7, min-y: -60, max-y: 16}

# Opciones activables. "value" es el episodio (0 = último), porcentaje, segundos o bloques según la opción.
features:
  teammate-compass: {enabled: true, value: 2}
  teammate-teleport: {enabled: true}
  resurrection: {enabled: false}
  escort: {enabled: false, value: 100}
  extra-episode: {enabled: false}
  rest: {enabled: false, value: 5}
  player-locator: {enabled: true, value: 0}
  skin-rotation: {enabled: false}
  head-steal-rod: {enabled: false}
  tridents: {enabled: false, value: 50}
  outpost-diamonds: {enabled: false, value: 50}
  camp-loot: {enabled: false, value: 50}
  ancient-city-cap: {enabled: true}
  knights-pact: {enabled: false, value: 4}
  shulker-box: {enabled: true, value: 4}
  life-boost: {enabled: true, value: 0}
  copper-age: {enabled: false}
  graves: {enabled: false, value: 4}
  super-apples: {enabled: false}
  dragon-breath: {enabled: false}
  ore-boost: {enabled: false, value: 100}
  big-caves: {enabled: false}

lobby:
  # Mini lobby flotante: zona de espera con el maniquí del creador y zona de resultados con tops.
  enabled: true
  # Mundo (vacío = mundo principal) y posición del centro del lobby.
  world: ""
  x: 0
  y: 300
  z: 0
  # Usuario cuya skin lleva el maniquí del lobby.
  mannequin: ItsTuki
  # Segundos tras el final antes de llevar a todos a la zona de resultados.
  results-delay: 8

death:
  # Minutos que un jugador vivo puede estar desconectado antes de quedar eliminado (0 = nunca).
  # Sus ítems caen donde se desconectó.
  offline-elimination-minutes: 10
  # Las cosas del jugador quedan en un cofre bajo la pica con su cabeza (el bloque útil va dentro del cofre).
  chest: true
  # Bloque que sostiene la pica con la cabeza del jugador muerto (material: peso).
  pike-blocks:
    CRAFTING_TABLE: 20
    FURNACE: 15
    ANVIL: 8
    BOOKSHELF: 10
    OBSIDIAN: 8
    IRON_BLOCK: 8
    GOLD_BLOCK: 6
    ENCHANTING_TABLE: 4
    TNT: 6
    DIAMOND_BLOCK: 1

# ───────────────────────── Network / core ─────────────────────────

proxy:
  # Actívalo si el servidor está detrás de BungeeCord o Velocity (canal "BungeeCord").
  enabled: false
  # Servidor del proxy al que se manda a los jugadores (/uhchub y al terminar).
  lobby-server: lobby
  # Registrar /hub y /lobby como alias de /uhchub (requiere reiniciar).
  hub-aliases: true
  # Al terminar la partida, enviar a todos al lobby de la network.
  send-to-lobby-on-end: true
  # Segundos extra (después de results-delay) antes de enviarlos.
  end-delay: 30
  # Qué hace el servidor después de vaciarse: RESET (nueva partida), SHUTDOWN (apagar, para servidores
  # que se reinician solos) o NONE.
  end-action: RESET
  # Con la partida en curso, mandar al lobby a quien entra (salvo tukiuhc.join.spectate, que entra a mirar).
  block-late-joins: false

# MOTD de la lista de servidores según el estado (textos en lang/*.yml, sección motd).
motd:
  enabled: true

# Inicio automático cuando hay suficientes jugadores (ideal para servidores de la network).
autostart:
  enabled: false
  min-players: 4
  # Segundos de cuenta atrás (se cancela si bajan los jugadores).
  countdown: 60

# Comandos de consola como recompensa (economía, puntos, etc.).
# Variables: {player} {killer} {victim} {kills} {team} {match}
rewards:
  enabled: true
  # Partidas más cortas que esto no dan premios (evita farmear).
  min-match-seconds: 60
  win: []
  #  - "economy give {player} gold-coin 5"
  kill: []
  #  - "economy give {killer} gold-coin 1"
  eliminated: []
  participation: []
  #  - "economy give {player} gold-coin 1"

# Rangos: con TukiCore (recomendado) o LuckPerms instalados, sus prefijos salen en el chat y en lang/*.yml
# como <rank>. Los rangos se crean y editan desde TukiCore (/rank) o LuckPerms.
ranks:
  # Prefijo del rango sobre la cabeza (y tab ordenado por rango) de quien no tiene equipo de UHC.
  nametag-prefix: true

luckperms:
  # Sin TukiCore: mostrar el prefijo de LuckPerms en el tab fuera de la partida.
  tab-prefix: true
