  timed-ending: "<prefix><yellow><white><time></white> left in the match."
  pvp-title: "<red><bold>PvP enabled"
  sudden-death: "<prefix><dark_red><bold>Time's up!</bold> <red>Sudden death: the border closes to the center and everyone glows until there is a winner."
