# TukiUHC — English texts (MiniMessage format: https://docs.advntr.dev/minimessage/format)
# <prefix> inserts the prefix. Leave a text as "" to not send it.
# No cambies este número: el plugin lo usa para actualizar el archivo.
lang-version: 7
prefix: "<dark_gray>[<gradient:#FF5555:#FFAA00><bold>UHC</bold></gradient><dark_gray>]</dark_gray> <gold>»</gold> "

formats:
  episodes:
    name: "<aqua>Episodes"
    description: "<gray>Parts with titles and optional rest."
  timed:
    name: "<gold>Timed"
    description: "<gray>Fixed length and a border that closes nonstop."

map:
  status-idle: "stopped"
  status-running: "running (<percent>%)"
  already-running: "<prefix><yellow>Pregeneration is already at <white><percent>%</white>."
  only-lobby: "<prefix><red>You can only pregenerate in the lobby, before preparing the match."
  started: "<prefix><green>Pregenerating <white><world></white> up to a radius of <white><radius></white> blocks (<white><chunks></white> chunks)…"
  stopped: "<prefix><yellow>Pregeneration stopped at <white><percent>%</white>. When resumed, finished chunks go fast."
  stopped-by-prepare: "<prefix><yellow>Pregeneration was stopped to prepare the match."
  not-running: "<prefix><gray>No pregeneration is running."
  status: "<prefix><gray>Pregeneration: <white><status></white> · radius <white><radius></white> · improved chunks: <white><shaped>"
  progress: "<prefix><gray>Pregenerating: <white><percent>%</white> (<done>/<total>) · <white><eta></white> left · TPS <white><tps>"
  actionbar: "<gold>Pregenerating map <white><percent>%</white> <dark_gray>|</dark_gray> <gray><done>/<total> <dark_gray>|</dark_gray> <white><eta></white> <gray>left <dark_gray>|</dark_gray> <gray>TPS <white><tps>"
  finished: "<prefix><green>Map pregenerated! <white><chunks></white> chunks in <white><time></white> (improved: <white><shaped></white>)."

scenarios:
  active: "<prefix><light_purple>Active scenarios: <white><list>"
  blocked: "<prefix><red>Not allowed: scenario <scenario><red>."
  no-clean-start: "<prefix><green>NoClean: you are invulnerable to other players for <white><seconds></white> s (lost if you attack)."
  no-clean-lost: "<prefix><yellow>You attacked: NoClean protection lost."
  no-clean-protected: "<prefix><red><white><player></white> is protected by NoClean (<white><seconds></white> s)."
  cut-clean:
    name: "<gold>CutClean"
    lore: ["<gray>Ores drop smelted, gravel drops", "<gray>flint and food drops cooked."]
  timber:
    name: "<gold>Timber"
    lore: ["<gray>Breaking a log fells the whole tree.", "<gray>Sneak to break just one."]
  hastey-boys:
    name: "<gold>HasteyBoys"
    lore: ["<gray>Pickaxes, axes and shovels come with", "<gray>Efficiency III and Unbreaking III."]
  double-ores:
    name: "<gold>Double ores"
    lore: ["<gray>Ores drop twice as much."]
  triple-ores:
    name: "<gold>Triple ores"
    lore: ["<gray>Ores drop three times as much."]
  lucky-leaves:
    name: "<gold>LuckyLeaves"
    lore: ["<gray>Leaves can drop a", "<gray>golden apple."]
  fireless:
    name: "<gold>Fireless"
    lore: ["<gray>No fire or lava damage."]
  no-fall:
    name: "<gold>NoFall"
    lore: ["<gray>No fall damage."]
  no-clean:
    name: "<gold>NoClean"
    lore: ["<gray>After a kill you are invulnerable to", "<gray>players for 20 s (lost if you attack)."]
  blood-diamonds:
    name: "<gold>BloodDiamonds"
    lore: ["<gray>Mining diamond costs half a heart."]
  diamondless:
    name: "<gold>Diamondless"
    lore: ["<gray>Diamond ore drops nothing."]
  goldless:
    name: "<gold>Goldless"
    lore: ["<gray>Gold ore drops nothing; every", "<gray>eliminated player drops 8 ingots."]
