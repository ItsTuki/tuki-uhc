    name: "<gold>Bowless"
    lore: ["<gray>Bows can't be crafted or used."]
  rodless:
    name: "<gold>Rodless"
    lore: ["<gray>Fishing rods can't be crafted or used."]
  horseless:
    name: "<gold>Horseless"
    lore: ["<gray>Horses can't be ridden."]

